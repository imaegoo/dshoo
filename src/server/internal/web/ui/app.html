<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>dshoo</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="app">
    <header class="topbar">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="5" r="2.1" />
            <circle cx="5.5" cy="18" r="2.1" />
            <circle cx="18.5" cy="18" r="2.1" />
            <path d="M10.6 6.9 6.9 16.2M13.4 6.9l3.7 9.3M7.6 18h8.8" />
          </svg>
        </span>
        dshoo
      </span>
      <span class="spacer"></span>
      <button class="icon-btn" id="refresh" type="button" title="刷新实例列表" aria-label="刷新实例列表">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6" /></svg>
      </button>
      <span class="who"><span class="avatar" id="avatar">?</span><span id="who-name"></span></span>
      <button class="icon-btn" id="logout" type="button" title="退出登录" aria-label="退出登录">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></svg>
      </button>
    </header>

    <main class="page">
      <div class="page-head">
        <h1>实例</h1>
        <span class="summary" id="summary">正在加载…</span>
      </div>

      <section class="group" id="online-group" hidden>
        <h2 class="group-head"><span class="dot on" aria-hidden="true"></span>在线<span class="count" id="online-count">0</span></h2>
        <div class="grid" id="online-grid"></div>
      </section>

      <section class="group" id="offline-group" hidden>
        <h2 class="group-head"><span class="dot" aria-hidden="true"></span>离线<span class="count" id="offline-count">0</span></h2>
        <div class="grid" id="offline-grid"></div>
      </section>

      <div class="empty" id="empty" hidden>
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="12" cy="5" r="2.1" />
            <circle cx="5.5" cy="18" r="2.1" />
            <circle cx="18.5" cy="18" r="2.1" />
            <path d="M10.6 6.9 6.9 16.2M13.4 6.9l3.7 9.3M7.6 18h8.8" />
          </svg>
        </span>
        <h2>还没有实例</h2>
        <p>在需要管理的机器上安装插件并连接，实例就会出现在这里。</p>
        <div class="steps">
          <div class="step"><b>1</b><span>DeepSeek Harness 桌面版：打开「插件 → 添加插件」，输入包名 <code>dshoo</code>，点安装后点「立即启用」</span></div>
          <div class="step"><b>2</b><span>或者用命令行安装：<code>dsh plugin --profile web add dshoo</code>（桌面版用 <code>desktop</code>），装完重启一次 dsh</span></div>
          <div class="step"><b>3</b><span>打开「设置 → 远程访问」，填写本服务器地址、用户名、密码，点「连接」</span></div>
        </div>
      </div>
    </main>

    <div class="toast" id="toast"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
